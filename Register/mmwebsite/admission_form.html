<!DOCTYPE html>
<html>
<head>
<title> HTML Form </title>
<meta charset="UTF 8"/>
<link rel = "stylesheet" href="college.css"/>
</head>
<body style="background-image:url('C:/Users/User/Desktop/collegewebsite/background/bg.jpg');">
<div id="form" style="margin: 0 auto; width:75%;">
  <form action="insert.php" method="POST">
  <fieldset>
     <legend>This is our Form</legend>
    Name: <br/>
	<input type="text" name="name"placeholder="write your name" required><br/><br/>
	Father Name:<br/>
	<input type="text" name="fathername"placeholder="write your father name" required><br/><br/>
    Mother Name:<br/>
	<input type="text" name="mothername"placeholder="write your mother name"required><br/><br/>
	Postal Code:<br/>
	<input type="number" name="postalcode" required><br/><br/>
	Address:<br/>
	<input type="text" name="address" placeholder="Enter your Address"required><br/><br/>
	Email:<br/>
	<input type="email" name="email" required><br/><br/>
	Password:<br/>
	<input type="password" name="password" required><br/><br/>
	Gender:<br/>
	<input type="radio" name="gender" value="m" required checked>Male<br/>
	<input type="radio" name="gender" value="f" required>Female<br><br/>
	Country:<br/>
	<select name="country" required>
	  <option>USA</option>
	  <option>Canada</option>
	  <option>Australia</option>
	  <option>France</option>
	  <option>Spain</option>
	  <option>England</option>
	  <option>Germany</option>
	  <option selected>Bangladesh</option>
	  <option>India</option>
	  <option>Japan</option>
	  <option>China</option>
	</select><br/><br/>
	District:<br/>
	<select name="district" required>
	<option>Jessore </option>
	<option> Bagerhat </option>
	<option> Faridput </option>
	<option>Kushtia </option>
	<option> Magura </option>
	<option> Patuakhali </option>
	<option> Pabna </option>
	</select><br/><br/>
	Mobile No:<br/>
	<input type="phone" name="phone" placeholder="+880" required><br/><br/>
	Birthdate:
	<input type="date" name="bdate" value="bdate" min="1950-05-25" max="2019-10-30" required><br/><br/>
	Age:
	<input type="number" name="age" value="age_num" min="18" max="50" required><br/><br/>
	<input type="submit" value="submit">
	<input type="reset" value="reset">
	</fieldset>
  </form>
  </div>
</body>
</html>
